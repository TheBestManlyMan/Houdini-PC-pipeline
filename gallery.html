<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FX Pipeline — Publish Gallery</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{--bg:oklch(14% 0.004 250);--bg-1:oklch(16% 0.004 250);--bg-2:oklch(18.5% 0.005 250);--bg-3:oklch(22% 0.006 250);--bg-hover:oklch(20% 0.006 250);--bg-active:oklch(26% 0.01 250);--border:oklch(24% 0.005 250);--border-2:oklch(30% 0.006 250);--border-3:oklch(38% 0.008 250);--text:oklch(94% 0.004 250);--text-2:oklch(78% 0.005 250);--text-3:oklch(60% 0.005 250);--text-4:oklch(45% 0.006 250);--text-5:oklch(36% 0.006 250);--accent:#e6a455;--accent-soft:color-mix(in oklch,var(--accent) 18%,transparent);--accent-line:color-mix(in oklch,var(--accent) 50%,transparent);--flipbook:oklch(70% 0.18 360);--render:oklch(78% 0.14 80);--asset:oklch(72% 0.16 160);--sans:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--mono:'Geist Mono','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;--radius:6px;--radius-lg:9px;--sidebar-w:240px;--detail-w:380px;--topbar-h:52px;--row-h:56px;--card-pad:11px}
[data-density="compact"]{--row-h:44px;--card-pad:8px}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:13px;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font-family:inherit}
.mono{font-family:var(--mono);font-feature-settings:"tnum"}
.muted{color:var(--text-5)}
.small{font-size:11px}
.app{display:flex;flex-direction:column;height:100vh;background:var(--bg)}
.main{display:grid;grid-template-columns:var(--sidebar-w) 1fr;flex:1;min-height:0}
.main[data-sidebar="off"]{grid-template-columns:1fr}
.main[data-detail="on"]{grid-template-columns:var(--sidebar-w) 1fr var(--detail-w)}
.main[data-sidebar="off"][data-detail="on"]{grid-template-columns:1fr var(--detail-w)}
.topbar{display:grid;grid-template-columns:var(--sidebar-w) 1fr auto;align-items:center;gap:16px;padding:0 16px;min-height:var(--topbar-h);background:var(--bg-1);border-bottom:1px solid var(--border);position:relative}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:var(--bg-3);color:var(--accent);border:1px solid var(--border-2)}
.brand-name{font-size:13px;font-weight:600;color:var(--text);letter-spacing:.01em}
.brand-sub{font-size:10.5px;color:var(--text-4);letter-spacing:.04em;text-transform:uppercase}
.search-wrap{display:flex;align-items:center;gap:8px;background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius);padding:6px 10px;max-width:520px;margin:0 auto;width:100%;color:var(--text-4);transition:border-color .15s,background .15s}
.search-wrap:focus-within{border-color:var(--border-3);background:var(--bg-3)}
.search{flex:1;border:0;outline:0;background:transparent;color:var(--text);font-size:13px}
.search::placeholder{color:var(--text-5)}
.kbd{font-family:var(--mono);font-size:10px;color:var(--text-4);background:var(--bg-3);border:1px solid var(--border-2);border-radius:4px;padding:2px 5px}
.top-right{display:flex;align-items:center;gap:10px}
.seg{display:flex;background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius);padding:2px}
.seg-btn{padding:5px 8px;border-radius:4px;color:var(--text-4);display:flex;align-items:center;justify-content:center;transition:color .15s,background .15s}
.seg-btn:hover{color:var(--text-2)}
.seg-btn.active{background:var(--bg-active);color:var(--text)}
.sort{display:flex;align-items:center;gap:6px;background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius);padding:5px 8px;color:var(--text-4)}
.sort select{background:none;border:0;outline:0;color:var(--text-2);font-size:12px;cursor:pointer}
.gen-time{display:flex;flex-direction:column;gap:0;line-height:1.3;text-align:right}
.chip-bar{position:absolute;left:var(--sidebar-w);right:0;bottom:-32px;height:32px;display:flex;align-items:center;gap:6px;padding:0 16px;background:var(--bg);border-bottom:1px solid var(--border);z-index:5}
.main[data-sidebar="off"] ~ .chip-bar{left:0}
.result-count{font-size:11.5px;color:var(--text-3);margin-right:6px}
.result-count strong{color:var(--text);font-weight:600}
.chip{display:flex;align-items:center;gap:5px;padding:3px 7px;background:var(--bg-2);border:1px solid var(--border-2);border-radius:99px;font-size:11px;color:var(--text-2);transition:border-color .12s}
.chip:hover{border-color:var(--border-3);color:var(--text)}
.chip-key{color:var(--text-5);text-transform:uppercase;font-size:9.5px;letter-spacing:.05em}
.chip-val{color:var(--text)}
.chip-clear{font-size:11px;color:var(--text-4);padding:3px 7px;margin-left:4px}
.chip-clear:hover{color:var(--text)}
.app:has(.chip-bar) .main{padding-top:32px}
.sidebar{background:var(--bg-1);border-right:1px solid var(--border);overflow-y:auto;padding:12px 0;font-size:12px}
.sidebar::-webkit-scrollbar{width:8px}
.sidebar::-webkit-scrollbar-thumb{background:var(--bg-3);border-radius:4px}
.side-section{padding:0 8px 14px}
.side-heading{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-5);padding:4px 8px 6px;font-weight:600}
.side-item{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:5px;color:var(--text-2);cursor:pointer;transition:background .1s,color .1s;min-height:26px;position:relative}
.side-item:hover{background:var(--bg-2);color:var(--text)}
.side-item.active{background:var(--accent-soft);color:var(--text)}
.side-item.active::before{content:'';position:absolute;left:-2px;top:5px;bottom:5px;width:2px;background:var(--accent);border-radius:2px}
.side-item.indent1{padding-left:18px}
.side-item.indent2{padding-left:32px;color:var(--text-3)}
.side-item span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.caret{width:14px;height:14px;display:flex;align-items:center;justify-content:center;color:var(--text-5);margin-left:-4px}
.caret:hover{color:var(--text-2)}
.task-dash{display:inline-block;width:6px;height:1px;background:var(--text-5);margin-right:2px}
.count-pill{font-size:10px;color:var(--text-5);font-family:var(--mono);margin-left:auto;padding:1px 5px;background:var(--bg-2);border-radius:99px;flex-shrink:0}
.side-item.active .count-pill{background:var(--bg-3);color:var(--text-2)}
.type-dot{display:inline-block;width:7px;height:7px;border-radius:2px;flex-shrink:0}
.type-dot.type-flipbook{background:var(--flipbook)}
.type-dot.type-render{background:var(--render)}
.type-dot.type-asset{background:var(--asset)}
.content{overflow-y:auto;background:var(--bg);position:relative}
.content::-webkit-scrollbar{width:10px}
.content::-webkit-scrollbar-thumb{background:var(--bg-3);border-radius:5px}
.empty{padding:100px 20px;text-align:center}
.empty-title{font-size:14px;color:var(--text-2);margin-bottom:6px}
.empty-sub{font-size:12px;color:var(--text-5)}
.grid-scroll{padding:12px 16px 40px}
.group{margin-bottom:24px}
.group-head{display:flex;align-items:center;gap:10px;padding:6px 4px 10px;position:sticky;top:0;background:var(--bg);z-index:2}
.group-title{font-size:11.5px;color:var(--text-3);font-weight:600;letter-spacing:.02em}
.group-count{font-family:var(--mono)}
.group-rule{flex:1;height:1px;background:var(--border)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:12px}
[data-density="compact"] .grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.card{background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;cursor:pointer;transition:border-color .12s,transform .1s,box-shadow .15s;display:flex;flex-direction:column}
.card:hover{border-color:var(--border-3);transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,0,0,.35)}
.card.selected{border-color:var(--accent-line);box-shadow:0 0 0 1px var(--accent-line) inset,0 6px 20px rgba(0,0,0,.35)}
.thumb{position:relative;width:100%;padding-top:56.25%;background:var(--bg);overflow:hidden}
.thumb img,.thumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb-overlay{position:absolute;top:7px;left:7px;right:7px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.thumb-bottom{position:absolute;bottom:6px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:center;color:rgba(255,255,255,.78);font-size:10px;text-shadow:0 1px 2px rgba(0,0,0,.6);pointer-events:none}
.play-pill{width:22px;height:22px;border-radius:99px;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;color:#fff}
.card-body{padding:var(--card-pad);display:flex;flex-direction:column;gap:3px}
.card-line1{display:flex;align-items:center;gap:6px;font-size:12.5px}
.card-line1 .title-text{color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.card-line2{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-2)}
.card-line2 .task{color:var(--text)}
.card-line2 .pname{color:var(--text-3)}
.card-line3 .ctx-small{font-size:10.5px;color:var(--text-5);font-family:var(--mono);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-foot{margin-top:5px;padding-top:6px;border-top:1px dashed var(--border);display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-4)}
.foot-user{color:var(--text-3)}
.foot-date{margin-left:auto;font-family:var(--mono);font-size:10.5px}
.ver{font-family:var(--mono);font-size:10.5px;color:var(--accent);background:var(--accent-soft);padding:1px 5px;border-radius:3px;letter-spacing:.01em;flex-shrink:0}
.status{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:99px;background:var(--bg-3);color:var(--text-2);border:1px solid var(--border-2)}
.status::before{content:'';width:5px;height:5px;border-radius:99px;background:currentColor}
.status.st-review{color:oklch(75% 0.13 80);background:oklch(28% 0.06 80/0.4);border-color:oklch(40% 0.08 80)}
.status.st-approved{color:oklch(78% 0.16 150);background:oklch(28% 0.06 150/0.4);border-color:oklch(40% 0.08 150)}
.status.st-rejected{color:oklch(70% 0.16 25);background:oklch(28% 0.07 25/0.4);border-color:oklch(40% 0.10 25)}
.status.st-wip{color:var(--text-3)}
.avatar{display:inline-flex;align-items:center;justify-content:center;border-radius:99px;color:#fff;font-weight:600;font-family:var(--mono);letter-spacing:.02em;flex-shrink:0}
.list{display:flex;flex-direction:column;padding:8px 16px}
.row{display:grid;grid-template-columns:88px 1fr 130px 70px auto;align-items:center;gap:12px;padding:8px;border-radius:var(--radius);cursor:pointer;transition:background .1s;border:1px solid transparent}
.row + .row{border-top:1px solid var(--border);border-radius:0}
.row:hover{background:var(--bg-1);border-color:var(--border)}
.row.selected{background:var(--accent-soft);border-color:var(--accent-line)}
.row-thumb{position:relative;width:88px;height:50px;border-radius:4px;overflow:hidden;background:var(--bg-2);flex-shrink:0}
.row-thumb img,.row-thumb video{width:100%;height:100%;object-fit:cover}
.row-thumb .play-pill{position:absolute;top:4px;right:4px;width:16px;height:16px}
.row-main{min-width:0}
.row-title{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text);margin-bottom:3px}
.row-title .title-text{font-weight:600}
.row-title .task{color:var(--text-2)}
.row-title .pname{color:var(--text-3)}
.row-meta{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-4)}
.row-meta .ctx{color:var(--text-3)}
.row-user{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-3)}
.row-date{font-size:11px;color:var(--text-4);font-family:var(--mono)}
.table{font-size:12px;padding:0 0 32px}
.th{display:grid;grid-template-columns:60px minmax(140px,1.5fr) 90px minmax(120px,1.2fr) 60px 60px 110px 80px 130px 100px 90px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--border);background:var(--bg-1);position:sticky;top:0;z-index:1;font-size:10.5px;color:var(--text-5);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.tr{display:grid;grid-template-columns:60px minmax(140px,1.5fr) 90px minmax(120px,1.2fr) 60px 60px 110px 80px 130px 100px 90px;align-items:center;padding:6px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.tr:hover{background:var(--bg-1)}
.tr.selected{background:var(--accent-soft)}
.td{color:var(--text-2);display:flex;align-items:center;gap:6px;min-width:0}
.td span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.td.c-thumb img{width:48px;height:27px;object-fit:cover;border-radius:3px}
.td.c-entity{color:var(--text);font-weight:500}
.td.c-ver{color:var(--accent)}
.detail{background:var(--bg-1);border-left:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column;min-height:0}
.detail::-webkit-scrollbar{width:8px}
.detail::-webkit-scrollbar-thumb{background:var(--bg-3);border-radius:4px}
.detail-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border)}
.detail-title{flex:1;min-width:0;display:flex;align-items:center;gap:6px;font-size:13px}
.detail-title .title-text{font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail-title .task{color:var(--text-2)}
.icon-btn{width:26px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--text-4);transition:background .1s,color .1s}
.icon-btn:hover{background:var(--bg-3);color:var(--text)}
.icon-btn.small{width:22px;height:22px}
.detail-preview{position:relative;margin:12px 14px 0;border-radius:var(--radius);overflow:hidden;aspect-ratio:16/9;background:var(--bg);cursor:ew-resize;border:1px solid var(--border)}
.detail-preview img,.detail-preview video{width:100%;height:100%;object-fit:cover}
.detail-preview .status{position:absolute;top:8px;left:8px}
.scrubber{position:absolute;left:8px;right:8px;bottom:8px;display:flex;align-items:center;gap:8px}
.scrub-track{flex:1;height:3px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden}
.scrub-fill{height:100%;background:var(--accent)}
.scrub-info{font-size:10px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);display:flex;gap:4px}
.detail-actions{display:flex;gap:6px;padding:12px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.primary-btn,.ghost-btn{display:flex;align-items:center;gap:6px;font-size:11.5px;padding:6px 10px;border-radius:5px;border:1px solid var(--border-2);transition:background .1s,border-color .1s}
.primary-btn{background:var(--accent);border-color:var(--accent);color:#1a1208;font-weight:600}
.primary-btn:hover{background:color-mix(in oklch,var(--accent) 88%,white)}
.ghost-btn{background:var(--bg-2);color:var(--text-2)}
.ghost-btn:hover{background:var(--bg-3);color:var(--text);border-color:var(--border-3)}
.detail-tabs{display:flex;border-bottom:1px solid var(--border);padding:0 14px}
.tab{padding:9px 12px;font-size:12px;color:var(--text-4);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .1s,border-color .1s}
.tab:hover{color:var(--text-2)}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}
.detail-body{padding:14px}
.kv-grid{display:grid;grid-template-columns:78px 1fr;gap:8px 14px;font-size:12px}
.kv-label{color:var(--text-5);text-transform:uppercase;font-size:10.5px;letter-spacing:.05em;padding-top:1px}
.kv-value{color:var(--text);display:flex;align-items:center;gap:6px;word-break:break-word}
.kv-value.mono{font-family:var(--mono)}
.block-label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-5);margin-bottom:6px;font-weight:600}
.desc-block{margin-top:18px}
.desc-text{color:var(--text-2);line-height:1.5;font-size:12.5px}
.path-block{margin-top:18px}
.path-text{background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:8px 10px;font-size:11px;color:var(--text-3);word-break:break-all;line-height:1.5}
.versions{display:flex;flex-direction:column;gap:6px}
.version-row{display:grid;grid-template-columns:64px 1fr auto;gap:10px;padding:8px;border-radius:6px;align-items:center;cursor:pointer;border:1px solid transparent;transition:background .1s,border-color .1s}
.version-row:hover{background:var(--bg-2)}
.version-row.current{background:var(--accent-soft);border-color:var(--accent-line)}
.version-row img{width:64px;height:36px;object-fit:cover;border-radius:3px}
.vr-main{min-width:0}
.vr-top{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.vr-desc{font-size:11.5px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:2px}
.vr-meta{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--text-4)}
.meta-json{background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:10px 12px;font-size:11px;line-height:1.6;color:var(--text-3);overflow-x:auto;max-height:400px;overflow-y:auto}
.settings-trigger{position:fixed;bottom:16px;right:16px;z-index:99;width:34px;height:34px;border-radius:50%;background:var(--bg-3);border:1px solid var(--border-2);color:var(--text-3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .1s,color .1s}
.settings-trigger:hover{background:var(--bg-active);color:var(--text)}
@media(max-width:860px){:root{--sidebar-w:0px;--detail-w:320px}.main{grid-template-columns:1fr}.main[data-detail="on"]{grid-template-columns:1fr var(--detail-w)}.sidebar{display:none}.topbar{grid-template-columns:auto 1fr auto;gap:12px}.chip-bar{left:0}}
@media(max-width:560px){.topbar .brand-text{display:none}.gen-time{display:none}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">
const __TWEAKS_STYLE = `
  .twk-panel{position:fixed;right:16px;bottom:16px;z-index:2147483646;width:280px;
    max-height:calc(100vh - 32px);display:flex;flex-direction:column;
    transform:scale(var(--dc-inv-zoom,1));transform-origin:bottom right;
    background:rgba(250,249,247,.78);color:#29261b;
    -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
    border:.5px solid rgba(255,255,255,.6);border-radius:14px;
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 12px 40px rgba(0,0,0,.18);
    font:11.5px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden}
  .twk-hd{display:flex;align-items:center;justify-content:space-between;
    padding:10px 8px 10px 14px;cursor:move;user-select:none}
  .twk-hd b{font-size:12px;font-weight:600;letter-spacing:.01em}
  .twk-x{appearance:none;border:0;background:transparent;color:rgba(41,38,27,.55);
    width:22px;height:22px;border-radius:6px;cursor:default;font-size:13px;line-height:1}
  .twk-x:hover{background:rgba(0,0,0,.06);color:#29261b}
  .twk-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 58 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    offsetRef.current = {
      x: Math.min(Math.max(PAD, window.innerWidth - w - PAD), Math.max(PAD, offsetRef.current.x)),
      y: Math.min(Math.max(PAD, window.innerHeight - h - PAD), Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(clampToViewport) : null;
    if (ro) { ro.observe(document.documentElement); return () => ro.disconnect(); }
    window.addEventListener('resize', clampToViewport);
    return () => window.removeEventListener('resize', clampToViewport);
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = { x: startRight - (ev.clientX - sx), y: startBottom - (ev.clientY - sy) };
      clampToViewport();
    };
    const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel"
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" onMouseDown={(e) => e.stopPropagation()} onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ label, children }) {
  return (<><div className="twk-sect">{label}</div>{children}</>);
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const valueRef = React.useRef(value);
  valueRef.current = value;
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const i = Math.floor(((clientX - r.left - 2) / (r.width - 4)) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };
  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => { if (trackRef.current) { const v = segAt(ev.clientX); if (v !== valueRef.current) onChange(v); } };
    const up = () => { setDragging(false); window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`, width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>{o.label}</button>
        ))}
      </div>
    </TweakRow>
  );
}

function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value} onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero] = colors;
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    style={{ background: hero }} onClick={() => onChange(o)}>
              {on && (
                <svg viewBox="0 0 14 14" aria-hidden="true">
                  <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
                        strokeLinecap="round" strokeLinejoin="round"
                        stroke={__twkIsLight(hero) ? 'rgba(0,0,0,.78)' : '#fff'} />
                </svg>
              )}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

Object.assign(window, { useTweaks, TweaksPanel, TweakSection, TweakRow, TweakSlider, TweakToggle, TweakRadio, TweakColor });

  const diff = (now - d) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
  if (diff < 86400 * 7) return `${Math.floor(diff/86400)}d ago`;
  return d.toLocaleDateString(undefined, { month:'short', day:'numeric' });
};

  );
};

const Sidebar = ({ pubs, filters, setFilters }) => {
  const tree = useMemo(() => {
    const t = {};
    pubs.forEach(p => {
      t[p.project] = t[p.project] || { count:0, entities:{} };
      t[p.project].count++;
      const ent = t[p.project].entities[p.entity] = t[p.project].entities[p.entity] || { count:0, type:p.entity_type, tasks:{} };
      ent.count++;
      ent.tasks[p.task] = (ent.tasks[p.task] || 0) + 1;
    });
    return t;
  }, [pubs]);

  const [openProj, setOpenProj] = useState(() => new Set(Object.keys(tree).slice(0,3)));
  const [openEnt, setOpenEnt] = useState(() => new Set());

  const typeCounts = useMemo(() => {
    const c = { flipbook:0, render:0, asset:0 };
    pubs.forEach(p => { if (c[p.pub_type] !== undefined) c[p.pub_type]++; });
    return c;
  }, [pubs]);

  const users = useMemo(() => {
    const c = {};
    pubs.forEach(p => c[p.published_by] = (c[p.published_by]||0) + 1);
    return Object.entries(c).sort((a,b) => b[1]-a[1]);
  }, [pubs]);

  const select = (project=null, entity=null, task=null) => setFilters({ ...filters, project, entity, task });
  const toggleProj = (p) => { const n = new Set(openProj); n.has(p)?n.delete(p):n.add(p); setOpenProj(n); };
  const toggleEnt = (e) => { const n = new Set(openEnt); n.has(e)?n.delete(e):n.add(e); setOpenEnt(n); };

  return (
    <aside className="sidebar">
      <div className="side-section">
        <div className="side-heading">Library</div>
        <div className={`side-item ${!filters.project&&!filters.type&&!filters.user?'active':''}`}
             onClick={() => setFilters({ project:null,entity:null,task:null,type:null,user:null,status:null })}>
          <Icon name="folder" size={13}/><span>All publishes</span>
          <span className="count-pill">{pubs.length}</span>
        </div>
      </div>
      <div className="side-section">
        <div className="side-heading">Type</div>
        {['flipbook','render','asset'].map(t => (
          <div key={t} className={`side-item ${filters.type===t?'active':''}`}
               onClick={() => setFilters({ ...filters, type:filters.type===t?null:t })}>
            <TypeDot type={t}/><span style={{ textTransform:'capitalize' }}>{t}</span>
            <span className="count-pill">{typeCounts[t]}</span>
          </div>
        ))}
      </div>
      <div className="side-section">
        <div className="side-heading">Projects</div>
        {Object.entries(tree).map(([proj, pdata]) => {
          const open = openProj.has(proj);
          return (
            <div key={proj}>
              <div className={`side-item ${filters.project===proj&&!filters.entity?'active':''}`}>
                <button className="caret" onClick={(e) => { e.stopPropagation(); toggleProj(proj); }}>
                  <Icon name={open?'chevronD':'chevron'} size={10}/>
                </button>
                <span style={{ flex:1,cursor:'pointer' }} onClick={() => select(proj)}>{proj}</span>
                <span className="count-pill">{pdata.count}</span>
              </div>
              {open && Object.entries(pdata.entities).map(([ent, edata]) => {
                const eopen = openEnt.has(`${proj}/${ent}`);
                return (
                  <div key={ent}>
                    <div className={`side-item indent1 ${filters.entity===ent&&!filters.task?'active':''}`}>
                      <button className="caret" onClick={(e) => { e.stopPropagation(); toggleEnt(`${proj}/${ent}`); }}>
                        <Icon name={eopen?'chevronD':'chevron'} size={10}/>
                      </button>
                      <Icon name={edata.type==='shot'?'shot':'asset'} size={11}/>
                      <span style={{ flex:1,cursor:'pointer',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap' }}
                            onClick={() => select(proj,ent)}>{ent}</span>
                      <span className="count-pill">{edata.count}</span>
                    </div>
                    {eopen && Object.entries(edata.tasks).map(([task, tcount]) => (
                      <div key={task} className={`side-item indent2 ${filters.entity===ent&&filters.task===task?'active':''}`}
                           onClick={() => select(proj,ent,task)}>
                        <span className="task-dash"/><span style={{ flex:1 }}>{task}</span>
                        <span className="count-pill">{tcount}</span>
                      </div>
                    ))}
                  </div>
                );
              })}
            </div>
          );
        })}
      </div>
      <div className="side-section">
        <div className="side-heading">Artists</div>
        {users.slice(0,8).map(([u, c]) => (
          <div key={u} className={`side-item ${filters.user===u?'active':''}`}
               onClick={() => setFilters({ ...filters, user:filters.user===u?null:u })}>
            <Avatar user={u} size={16}/>
            <span style={{ flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap' }}>{u}</span>
            <span className="count-pill">{c}</span>
          </div>
        ))}
      </div>
    </aside>
  );
};

const DetailPanel = ({ pub, allPubs, onClose, onSelect }) => {
  const [tab, setTab] = useState('overview');
  const [copied, setCopied] = useState(false);
  const [previewFrame, setPreviewFrame] = useState(null);
  const [scrubbing, setScrubbing] = useState(false);

  const versions = useMemo(() => {
    if (!pub) return [];
    return allPubs.filter(p => p.entity===pub.entity && p.task===pub.task && p.publish_name===pub.publish_name)
                  .sort((a,b) => b.version - a.version);
  }, [pub, allPubs]);

  if (!pub) return null;

  const copy = () => {
    navigator.clipboard?.writeText(pub.path || pub.context).catch(() => {});
    setCopied(true); setTimeout(() => setCopied(false), 1400);
  };

  const frames = (pub.frame_end||0) - (pub.frame_start||0) + 1;
  const onScrub = (e) => {
    const r = e.currentTarget.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.clientX-r.left)/r.width));
    setPreviewFrame((pub.frame_start||0) + Math.floor(pct*(frames-1)));
  };

  const isRealVideo = pub.mp4 && pub.mp4 !== '__demo__';

  return (
    <aside className="detail">
      <div className="detail-head">
        <div className="detail-title">
          <TypeDot type={pub.pub_type}/>
          <span className="title-text">{pub.entity}</span>
          <span className="muted">·</span>
          <span className="task">{pub.task}</span>
          <span className="ver">v{pad3(pub.version)}</span>
        </div>
        <button className="icon-btn" onClick={onClose} title="Close"><Icon name="close" size={12}/></button>
      </div>

      <div className="detail-preview"
           onMouseDown={(e) => { setScrubbing(true); onScrub(e); }}
           onMouseUp={() => setScrubbing(false)}
           onMouseLeave={() => { setScrubbing(false); setPreviewFrame(null); }}
           onMouseMove={(e) => scrubbing && onScrub(e)}>
        {isRealVideo
          ? <video src={pub.mp4} poster={pub.thumbnail} muted loop autoPlay playsInline style={{ width:'100%',height:'100%',objectFit:'cover' }}/>
          : <>{pub.thumbnail && <img src={pub.thumbnail} alt=""/>}{pub.mp4==='__demo__' && <HoverPreview pub={pub} playing={true}/>}</>
        }
        {pub.frame_start != null && !isRealVideo && (
          <div className="scrubber">
            <div className="scrub-track">
              <div className="scrub-fill" style={{ width: previewFrame!=null ? `${((previewFrame-pub.frame_start)/Math.max(1,frames-1))*100}%` : '0%' }}/>
            </div>
            <div className="scrub-info mono">
              <span>F {previewFrame ?? pub.frame_start}</span>
              <span className="muted">/ {pub.frame_end}</span>
            </div>
          </div>
        )}
        <StatusBadge status={pub.status||'wip'}/>
      </div>

      <div className="detail-actions">
        <button className="primary-btn" onClick={() => pub.mp4 && window.open(pub.mp4,'_blank')}>
          <Icon name="open" size={12}/>Open file
        </button>
        <button className="ghost-btn" onClick={copy}>
          <Icon name={copied?'check':'copy'} size={12}/>{copied ? 'Copied' : 'Copy path'}
        </button>
      </div>

      <div className="detail-tabs">
        {[{id:'overview',label:'Overview'},{id:'versions',label:`Versions · ${versions.length}`},{id:'metadata',label:'Metadata'}].map(t => (
          <button key={t.id} className={`tab ${tab===t.id?'active':''}`} onClick={() => setTab(t.id)}>{t.label}</button>
        ))}
      </div>

      <div className="detail-body">
        {tab === 'overview' && (
          <>
            <div className="kv-grid">
              <div className="kv-label">Project</div><div className="kv-value">{pub.project}</div>
              <div className="kv-label">Entity</div>
              <div className="kv-value"><Icon name={pub.entity_type==='shot'?'shot':'asset'} size={11}/>{pub.entity}</div>
              <div className="kv-label">Context</div><div className="kv-value mono small">{pub.context}</div>
              <div className="kv-label">Task</div><div className="kv-value">{pub.task}</div>
              <div className="kv-label">Publish</div><div className="kv-value">{pub.publish_name}</div>
              <div className="kv-label">Format</div><div className="kv-value mono">{(pub.fmt||'').toUpperCase()}</div>
              <div className="kv-label">Frames</div><div className="kv-value mono">{fmtFrames(pub.frame_start,pub.frame_end)}</div>
              {pub.size_mb != null && <><div className="kv-label">Size</div><div className="kv-value mono">{fmtSize(pub.size_mb)}</div></>}
              <div className="kv-label">Published</div>
              <div className="kv-value">
                <Avatar user={pub.published_by} size={16}/>
                <span>{pub.published_by}</span>
                <span className="muted">·</span>
                <span title={fmtDateLong(pub.published_at)}>{fmtDate(pub.published_at)}</span>
              </div>
            </div>
            {pub.description && (
              <div className="desc-block">
                <div className="block-label">Notes</div>
                <div className="desc-text">{pub.description}</div>
              </div>
            )}
            {pub.path && (
              <div className="path-block">
                <div className="block-label">Path</div>
                <div className="path-text mono">{pub.path}</div>
              </div>
            )}
          </>
        )}
        {tab === 'versions' && (
          <div className="versions">
            {versions.map(v => (
              <div key={v.id||v.version} className={`version-row ${v.id===pub.id?'current':''}`} onClick={() => onSelect(v)}>
                {v.thumbnail && <img src={v.thumbnail} alt=""/>}
                <div className="vr-main">
                  <div className="vr-top">
                    <span className="ver">v{pad3(v.version)}</span>
                    {v.id===pub.id && <span className="muted small">current</span>}
                    <StatusBadge status={v.status||'wip'}/>
                  </div>
                  <div className="vr-desc">{v.description}</div>
                  <div className="vr-meta">
                    <Avatar user={v.published_by} size={14}/>
                    <span>{v.published_by}</span><span className="muted">·</span><span>{fmtDate(v.published_at)}</span>
                  </div>
                </div>
                <button className="icon-btn small" title="Compare"><Icon name="diff" size={12}/></button>
              </div>
            ))}
          </div>
        )}
        {tab === 'metadata' && (
          <div>
            <div className="block-label">Raw payload</div>
            <pre className="meta-json mono">{JSON.stringify({
              id:pub.id, project:pub.project, entity_type:pub.entity_type, context:pub.context,
              pub_type:pub.pub_type, entity:pub.entity, task:pub.task, publish_name:pub.publish_name,
              fmt:pub.fmt, version:pub.version, published_by:pub.published_by,
              published_at:pub.published_at, frame_start:pub.frame_start, frame_end:pub.frame_end,
              status:pub.status, size_mb:pub.size_mb,
            }, null, 2)}</pre>
          </div>
        )}
      </div>
    </aside>
  );
};

// Map indexer v2 schema → gallery display fields.
function normalizePub(p) {
  const ctx = p.context || {};
  let ctxStr = '';
  if (ctx.type === 'shot') ctxStr = [ctx.sequence, ctx.shot].filter(Boolean).join('/');
  else ctxStr = [ctx.asset_type, ctx.asset].filter(Boolean).join('/');
  const outputs = p.outputs || {};
  const stats = p.stats || {};
  return {
    id: p.uuid || p._index_path,
    project: p.project || '',
    entity_type: ctx.type || 'unknown',
    context: ctxStr,
    pub_type: p.publish_type || '',
    entity: p.entity || '',
    task: p.task || '',
    publish_name: p.task || '',
    fmt: p.publish_type || '',
    version: p.version || 0,
    published_by: p.created_by || '',
    published_at: p.created_at || '',
    description: Array.isArray(p.notes) ? (p.notes[0] || '') : (p.description || ''),
    frame_start: stats.frame_start != null ? stats.frame_start : null,
    frame_end:   stats.frame_end   != null ? stats.frame_end   : null,
    thumbnail: outputs.thumbnail || '',
    mp4: outputs.mp4 || '',
    status: p.status || 'wip',
    size_mb: stats.disk_mb != null ? stats.disk_mb : null,
    path: p._index_path || '',
  };
}

const TWEAK_DEFAULTS = { view:'grid', density:'comfortable', accent:'#e6a455', showSidebar:true };

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [filters, setFilters] = useState({ project:null,entity:null,task:null,type:null,user:null,status:null });
  const [search, setSearch] = useState('');
  const [view, setView] = useState(tweaks.view);
  const [sort, setSort] = useState('date-desc');
  const [selected, setSelected] = useState(null);
  const [PUBS, setPUBS] = useState([]);
  const [genTime, setGenTime] = useState(null);
  const [loadState, setLoadState] = useState('loading');

  useEffect(() => {
    fetch('./index.json')
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(data => {
        setPUBS((data.publishes || []).map(normalizePub));
        setGenTime(data.generated_at || null);
        setLoadState('ok');
      })
      .catch(() => setLoadState('error'));
  }, []);

  useEffect(() => setView(tweaks.view), [tweaks.view]);
  useEffect(() => { document.documentElement.style.setProperty('--accent', tweaks.accent); }, [tweaks.accent]);
  useEffect(() => { document.documentElement.dataset.density = tweaks.density; }, [tweaks.density]);

  if (loadState === 'loading') return (
    <div className="app" style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh'}}>
      <div className="empty"><div className="empty-title">Loading index.json…</div></div>
    </div>
  );
  if (loadState === 'error') return (
    <div className="app" style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh'}}>
      <div className="empty">
        <div className="empty-title">No index.json found</div>
        <div className="empty-sub">Run the publisher, or open this page via<br/><code style={{fontFamily:'var(--mono)',fontSize:'11px'}}>python -m http.server</code><br/>from the projects root.</div>
      </div>
    </div>
  );

  const filtered = useMemo(() => {
    const q = search.toLowerCase().trim();
    let out = PUBS.filter(p => {
      if (filters.project && p.project !== filters.project) return false;
      if (filters.entity  && p.entity  !== filters.entity)  return false;
      if (filters.task    && p.task    !== filters.task)    return false;
      if (filters.type    && p.pub_type !== filters.type)   return false;
      if (filters.user    && p.published_by !== filters.user) return false;
      if (filters.status  && p.status   !== filters.status)  return false;
      if (q) {
        const hay = [p.entity,p.task,p.publish_name,p.description,p.context,p.project,p.published_by].join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    switch (sort) {
      case 'date-asc':     out.sort((a,b) => a.published_at.localeCompare(b.published_at)); break;
      case 'entity':       out.sort((a,b) => (a.entity||'').localeCompare(b.entity||'') || b.version-a.version); break;
      case 'version-desc': out.sort((a,b) => b.version-a.version); break;
      default:             out.sort((a,b) => (b.published_at||'').localeCompare(a.published_at||''));
    }
    return out;
  }, [filters, search, sort, PUBS]);

  useEffect(() => {
    const onKey = (e) => {
      if (e.key === 'Escape') setSelected(null);
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); document.querySelector('.search')?.focus(); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const grouped = useMemo(() => {
    if (view !== 'grid') return null;
    const g = new Map();
    filtered.forEach(p => {
      const key = `${p.project} / ${p.entity}`;
      if (!g.has(key)) g.set(key, []);
      g.get(key).push(p);
    });
    return g;
  }, [filtered, view]);

  return (
    <div className="app">
      <Topbar filters={filters} setFilters={setFilters}
              view={view} setView={(v) => { setView(v); setTweak('view', v); }}
              sort={sort} setSort={setSort}
              count={filtered.length} total={PUBS.length}
              search={search} setSearch={setSearch}
              genTime={genTime}/>

      <div className="main" data-sidebar={tweaks.showSidebar?'on':'off'} data-detail={selected?'on':'off'}>
        {tweaks.showSidebar && <Sidebar pubs={PUBS} filters={filters} setFilters={setFilters}/>}

        <main className="content">
          {filtered.length === 0 ? (
            <div className="empty">
              <div className="empty-title">No publishes match</div>
              <div className="empty-sub">Try clearing filters or changing your search.</div>
            </div>
          ) : view === 'grid' ? (
            <div className="grid-scroll">
              {[...grouped.entries()].map(([key, pubs]) => (
                <section className="group" key={key}>
                  <div className="group-head">
                    <span className="group-title">{key}</span>
                    <span className="group-count muted small">{pubs.length}</span>
                    <span className="group-rule"/>
                  </div>
                  <div className="grid">
                    {pubs.map(p => <Card key={p.id||p.published_at+p.entity+p.version} pub={p} selected={selected?.id===p.id} onSelect={setSelected} view="grid"/>)}
                  </div>
                </section>
              ))}
            </div>
          ) : view === 'list' ? (
            <div className="list">
              {filtered.map(p => <Card key={p.id||p.published_at+p.entity+p.version} pub={p} selected={selected?.id===p.id} onSelect={setSelected} view="list"/>)}
            </div>
          ) : (
            <TableView pubs={filtered} selected={selected} onSelect={setSelected}/>
          )}
        </main>

        {selected && <DetailPanel pub={selected} allPubs={PUBS} onClose={() => setSelected(null)} onSelect={setSelected}/>}
      </div>

      <button className="settings-trigger" title="View settings"
              onClick={() => window.postMessage({ type:'__activate_edit_mode' }, '*')}>
        <Icon name="settings" size={14}/>
      </button>
      <TweaksPanel title="Settings">
        <TweakSection label="Layout">
          <TweakRadio label="View" value={tweaks.view}
                      options={[{value:'grid',label:'Grid'},{value:'list',label:'List'},{value:'table',label:'Table'}]}
                      onChange={(v) => setTweak('view', v)}/>
          <TweakRadio label="Density" value={tweaks.density}
                      options={[{value:'compact',label:'Compact'},{value:'comfortable',label:'Cozy'}]}
                      onChange={(v) => setTweak('density', v)}/>
          <TweakToggle label="Sidebar" value={tweaks.showSidebar} onChange={(v) => setTweak('showSidebar', v)}/>
        </TweakSection>
        <TweakSection label="Theme">
          <TweakColor label="Accent" value={tweaks.accent}
                      options={['#e6a455','#7ab9f7','#9be37a','#d97f7f','#b39ce6']}
                      onChange={(v) => setTweak('accent', v)}/>
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
